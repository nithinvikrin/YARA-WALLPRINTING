<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0742" />
      <stop offset="100%" stop-color="#04021F" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0BA" />
      <stop offset="50%" stop-color="#CF9F0E" />
      <stop offset="100%" stop-color="#9B7300" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#CF9F0E" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-opacity="0.5" />

  <!-- Wall Grid Lines -->
  <path d="M128 100 V412 M256 100 V412 M384 100 V412" stroke="#CF9F0E" stroke-opacity="0.15" stroke-width="6" stroke-dasharray="16 16" />
  <path d="M100 192 H412 M100 320 H412" stroke="#CF9F0E" stroke-opacity="0.15" stroke-width="6" />

  <!-- Stylized Y & W Wall Printer Emblem -->
  <g filter="url(#goldGlow)">
    <path d="M130 150 L205 342 L256 220 L307 342 L382 150" fill="none" stroke="url(#goldGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="256" cy="140" r="22" fill="url(#goldGrad)" />
    <path d="M256 140 V360" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 12" />
  </g>
</svg>
