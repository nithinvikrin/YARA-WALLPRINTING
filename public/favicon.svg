<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0742" />
      <stop offset="100%" stop-color="#04021F" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0BA" />
      <stop offset="50%" stop-color="#CF9F0E" />
      <stop offset="100%" stop-color="#9B7300" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#CF9F0E" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-opacity="0.5" />

  <!-- Wall Grid Lines (Subtle background texture) -->
  <path d="M128 100 V412 M256 100 V412 M384 100 V412" stroke="#CF9F0E" stroke-opacity="0.12" stroke-width="6" stroke-dasharray="16 16" />
  <path d="M100 192 H412 M100 320 H412" stroke="#CF9F0E" stroke-opacity="0.12" stroke-width="6" />

  <!-- Dynamic 'W' Wall Printer Logo Symbol -->
  <g filter="url(#goldGlow)">
    <path d="M120 160 L195 352 L256 225 L317 352 L392 160" fill="none" stroke="url(#goldGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Vertical Print Beam Center Accent -->
    <circle cx="256" cy="145" r="22" fill="url(#goldGrad)" />
    <path d="M256 145 V370" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 12" />
  </g>
</svg>